name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: ViPlay-macOS
          - os: windows-latest
            artifact: ViPlay-Windows
          - os: ubuntu-latest
            artifact: ViPlay-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: npm ci
        working-directory: frontend
      # A clean checkout has no ignored frontend/dist directory. Build it before
      # Wails loads the Go package for binding generation and evaluates go:embed.
      - run: npm run build
        working-directory: frontend
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
      - run: wails3 task package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/**
