name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: ViPlay-macOS
          - os: windows-latest
            artifact: ViPlay-Windows
          - os: ubuntu-latest
            artifact: ViPlay-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: npm ci
        working-directory: frontend
      # A clean checkout has no ignored frontend/dist directory. Build it before
      # Wails loads the Go package for binding generation and evaluates go:embed.
      - run: npm run build
        working-directory: frontend
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: wails3 task package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/**
      # GPL compliance: publish the corresponding source of every bundled component with the binaries.
      - name: macOS bundled component sources
        if: runner.os == 'macOS'
        run: |
          # The core tap lets Homebrew load formula resources and patches instead of the JSON API summary.
          brew tap --force homebrew/core
          python3 build/darwin/fetch_sources.py bin/ViPlay.app dist/sources
          ditto -c -k --keepParent bin/ViPlay.app dist/ViPlay-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ViPlay-macOS-bundled-sources
          path: dist/sources/**
      # Every platform attaches its packages to the tag's release; whichever job runs first creates it.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p release
          case "$RUNNER_OS" in
            macOS)
              cp dist/ViPlay-macOS.zip "release/ViPlay-$version-macOS.zip"
              tar -cf "release/ViPlay-$version-macOS-bundled-sources.tar" -C dist sources
              ;;
            Windows)
              cp bin/ViPlay-amd64-installer.exe "release/ViPlay-$version-windows-amd64-installer.exe"
              ;;
            Linux)
              cp bin/ViPlay.deb "release/ViPlay-$version-linux-amd64.deb"
              cp bin/ViPlay.rpm "release/ViPlay-$version-linux-amd64.rpm"
              cp bin/viplay-x86_64.AppImage "release/ViPlay-$version-linux-x86_64.AppImage"
              cp bin/ViPlay.pkg.tar.zst "release/ViPlay-$version-linux-amd64.pkg.tar.zst"
              ;;
          esac
          gh release view "$version" >/dev/null 2>&1 \
            || gh release create "$version" --title "ViPlay $version" --generate-notes \
            || gh release view "$version" >/dev/null
          gh release upload "$version" release/* --clobber
