# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "ViPlay"
  productName: "ViPlay"
  productIdentifier: "io.viplay.desktop"
  description: "Cross-platform desktop video player"
  copyright: "Copyright © 2026 Çağatay Tengiz. Licensed under GPL-3.0-or-later."
  comments: "Built with Go and Wails v3"
  version: "0.3.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
  # Registers ViPlay as a viewer so Finder lists it under Open With; keep in sync with isSupportedMedia.
  # iconName resolves to build/darwin/icons.icns and build/windows/icons.ico (a copy of icon.ico for the NSIS installer).
  - ext: mp4
    name: MPEG-4 video
    description: MPEG-4 video
    iconName: icons
    role: Viewer
    mimeType: video/mp4
  - ext: m4v
    name: MPEG-4 video
    description: MPEG-4 video
    iconName: icons
    role: Viewer
    mimeType: video/x-m4v
  - ext: mov
    name: QuickTime movie
    description: QuickTime movie
    iconName: icons
    role: Viewer
    mimeType: video/quicktime
  - ext: webm
    name: WebM video
    description: WebM video
    iconName: icons
    role: Viewer
    mimeType: video/webm
  - ext: mkv
    name: Matroska video
    description: Matroska video
    iconName: icons
    role: Viewer
    mimeType: video/x-matroska
  - ext: avi
    name: AVI video
    description: AVI video
    iconName: icons
    role: Viewer
    mimeType: video/x-msvideo
  - ext: wmv
    name: Windows Media video
    description: Windows Media video
    iconName: icons
    role: Viewer
    mimeType: video/x-ms-wmv
  - ext: asf
    name: Advanced Systems Format video
    description: Advanced Systems Format video
    iconName: icons
    role: Viewer
    mimeType: video/x-ms-asf
  - ext: mpg
    name: MPEG video
    description: MPEG video
    iconName: icons
    role: Viewer
    mimeType: video/mpeg
  - ext: mpeg
    name: MPEG video
    description: MPEG video
    iconName: icons
    role: Viewer
    mimeType: video/mpeg
  - ext: flv
    name: Flash video
    description: Flash video
    iconName: icons
    role: Viewer
    mimeType: video/x-flv
  - ext: mp3
    name: MP3 audio
    description: MP3 audio
    iconName: icons
    role: Viewer
    mimeType: audio/mpeg
  - ext: m4a
    name: MPEG-4 audio
    description: MPEG-4 audio
    iconName: icons
    role: Viewer
    mimeType: audio/mp4
  - ext: wav
    name: WAV audio
    description: WAV audio
    iconName: icons
    role: Viewer
    mimeType: audio/wav
  - ext: flac
    name: FLAC audio
    description: FLAC audio
    iconName: icons
    role: Viewer
    mimeType: audio/flac

# Other data
other:
  - name: My Other Data
